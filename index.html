<script>
(function(){
"use strict";

/* =========================================================
   MARS // JARVIS
   COMPLETE REPAIRED CORE
   ========================================================= */

const DEFAULT_DATA={
  notes:[],
  tasks:[],
  research:[],
  settings:{
    continuous:false,
    speak:true,
    appControl:true,
    appConfirm:false,
    aiBackend:""
  },
  conversations:[]
};

let state=structuredClone(DEFAULT_DATA);

let driveFileId=null;
let accessToken=null;
let gisClient=null;
let saveTimer=null;
let pendingAction=null;

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function uid(){
  return Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);
}

function nowStr(){
  return new Date().toLocaleString("de-DE",{
    month:"short",
    day:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function truncate(s,n){
  s=String(s||"");
  return s.length>n?s.slice(0,n)+"…":s;
}

function escapeHtml(s){
  const d=document.createElement("div");
  d.textContent=String(s||"");
  return d.innerHTML;
}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function localSave(){

  try{

    localStorage.setItem(
      "mars_jarvis_data",
      JSON.stringify(state)
    );

    const clientInput=$("#clientIdInput");

    if(clientInput){

      localStorage.setItem(
        "mars_jarvis_client_id",
        clientInput.value||""
      );
    }

  }catch(e){

    console.error(
      "Local save error:",
      e
    );
  }
}

function localLoad(){

  try{

    const raw=
      localStorage.getItem(
        "mars_jarvis_data"
      );

    if(raw){

      const parsed=
        JSON.parse(raw);

      state=Object.assign(
        structuredClone(DEFAULT_DATA),
        parsed
      );
    }

  }catch(e){

    console.error(
      "Local load error:",
      e
    );

    state=structuredClone(
      DEFAULT_DATA
    );
  }

  if(!state.settings){

    state.settings=
      structuredClone(
        DEFAULT_DATA.settings
      );

  }else{

    state.settings=
      Object.assign(
        structuredClone(
          DEFAULT_DATA.settings
        ),
        state.settings
      );
  }

  if(!Array.isArray(state.notes))
    state.notes=[];

  if(!Array.isArray(state.tasks))
    state.tasks=[];

  if(!Array.isArray(state.research))
    state.research=[];

  if(!Array.isArray(state.conversations))
    state.conversations=[];

  try{

    const cid=
      localStorage.getItem(
        "mars_jarvis_client_id"
      );

    if(
      cid&&
      $("#clientIdInput")
    ){

      $("#clientIdInput").value=cid;
    }

  }catch(e){}

  try{

    const ai=
      localStorage.getItem(
        "mars_jarvis_ai_backend"
      );

    if(ai){

      state.settings.aiBackend=ai;
    }

    if($("#aiBackendInput")){

      $("#aiBackendInput").value=
        state.settings.aiBackend||"";
    }

  }catch(e){}
}


/* =========================================================
   GOOGLE DRIVE
   ========================================================= */

function setDriveStatus(connected,label){

  if($("#driveDot")){

    $("#driveDot").classList.toggle(
      "on",
      !!connected
    );
  }

  if($("#driveStatus")){

    $("#driveStatus").textContent=
      label||
      (
        connected
        ?"Drive connected"
        :"Drive offline"
      );
  }

  if($("#authBtn")){

    $("#authBtn").textContent=
      connected
      ?"Sign out"
      :"Sign in";
  }
}

function loadGis(cb){

  if(
    window.google&&
    google.accounts
  ){

    cb();
    return;
  }

  const s=
    document.createElement("script");

  s.src=
    "https://accounts.google.com/gsi/client";

  s.async=true;

  s.onload=cb;

  s.onerror=()=>{

    setDriveStatus(
      false,
      "Google Sign-In unavailable"
    );
  };

  document.head.appendChild(s);
}

function initAuth(){

  const input=
    $("#clientIdInput");

  const clientId=
    input
    ?input.value.trim()
    :"";

  if(!clientId){

    alert(
      "Add your Google OAuth Client ID in Settings first."
    );

    switchView("settings");

    return;
  }

  loadGis(()=>{

    gisClient=
      google.accounts.oauth2.initTokenClient({

        client_id:clientId,

        scope:
          "https://www.googleapis.com/auth/drive.appdata",

        callback:async resp=>{

          if(resp.error){

            console.error(
              "Google authentication error:",
              resp
            );

            setDriveStatus(
              false,
              "Auth failed"
            );

            return;
          }

          accessToken=
            resp.access_token;

          setDriveStatus(
            true,
            "Drive connected"
          );

          try{

            await driveFindOrCreateFile();
            await driveLoad();

            renderAll();
            renderChat();

          }catch(e){

            console.error(
              "Drive initialization error:",
              e
            );

            setDriveStatus(
              false,
              "Drive error"
            );
          }
        }
      });

    gisClient.requestAccessToken();
  });
}

async function driveApi(path,opts={}){

  const res=
    await fetch(
      "https://www.googleapis.com"+path,
      Object.assign(
        {},
        opts,
        {
          headers:Object.assign(
            {},
            opts.headers||{},
            {
              Authorization:
                "Bearer "+accessToken
            }
          )
        }
      )
    );

  if(!res.ok){

    throw new Error(
      "Drive API error "+res.status
    );
  }

  return res;
}

async function driveFindOrCreateFile(){

  const q=
    encodeURIComponent(
      "name='jarvis-data.json' and trashed=false"
    );

  const listRes=
    await driveApi(
      "/drive/v3/files?spaces=appDataFolder&q="+
      q+
      "&fields=files(id,name)"
    );

  const list=
    await listRes.json();

  if(
    list.files&&
    list.files.length
  ){

    driveFileId=
      list.files[0].id;

  }else{

    const meta={
      name:"jarvis-data.json",
      parents:["appDataFolder"]
    };

    const createRes=
      await driveApi(
        "/drive/v3/files?fields=id",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify(meta)
        }
      );

    driveFileId=
      (await createRes.json()).id;

    await driveSave();
  }
}

async function driveLoad(){

  if(!driveFileId)return;

  try{

    const res=
      await driveApi(
        "/drive/v3/files/"+
        driveFileId+
        "?alt=media"
      );

    const text=
      await res.text();

    if(text){

      state=Object.assign(
        structuredClone(DEFAULT_DATA),
        JSON.parse(text)
      );

      state.settings=
        Object.assign(
          structuredClone(
            DEFAULT_DATA.settings
          ),
          state.settings||{}
        );

      if(!Array.isArray(state.notes))
        state.notes=[];

      if(!Array.isArray(state.tasks))
        state.tasks=[];

      if(!Array.isArray(state.conversations))
        state.conversations=[];

      localSave();
      applySettingsToUI();
    }

  }catch(e){

    console.error(
      "Drive load error:",
      e
    );
  }
}

async function driveSave(){

  localSave();

  if(
    !accessToken||
    !driveFileId
  ){
    return;
  }

  try{

    await driveApi(
      "/upload/drive/v3/files/"+
      driveFileId+
      "?uploadType=media",
      {
        method:"PATCH",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify(state)
      }
    );

  }catch(e){

    console.error(
      "Drive save error:",
      e
    );
  }
}

function queueSave(){

  clearTimeout(saveTimer);

  saveTimer=
    setTimeout(
      driveSave,
      600
    );
}

function signOut(){

  accessToken=null;
  driveFileId=null;

  setDriveStatus(
    false,
    "Drive offline"
  );
}

if($("#authBtn")){

  $("#authBtn").addEventListener(
    "click",
    ()=>{
      accessToken
        ?signOut()
        :initAuth();
    }
  );
}

if($("#signOutBtn")){

  $("#signOutBtn").addEventListener(
    "click",
    signOut
  );
}

if($("#saveClientId")){

  $("#saveClientId").addEventListener(
    "click",
    ()=>{
      localSave();
      initAuth();
    }
  );
}


/* =========================================================
   NAVIGATION
   ========================================================= */

const titles={
  home:["HOME","System overview"],
  memory:["MEMORY","Notes archive"],
  tasks:["TASKS","Mission queue"],
  voice:["VOICE CONSOLE","Speak to JARVIS"],
  chat:["JARVIS CHAT","Text conversation"],
  settings:["SETTINGS","Configuration"]
};

function switchView(name){

  if(!titles[name])
    name="home";

  $$(".nav-btn").forEach(
    b=>{
      b.classList.toggle(
        "active",
        b.dataset.view===name
      );
    }
  );

  $$(".view").forEach(
    v=>{
      v.classList.toggle(
        "active",
        v.id==="view-"+name
      );
    }
  );

  if($("#viewTitle"))
    $("#viewTitle").textContent=
      titles[name][0];

  if($("#viewSub"))
    $("#viewSub").textContent=
      titles[name][1];
}

$$(".nav-btn").forEach(
  b=>{
    b.addEventListener(
      "click",
      ()=>{
        switchView(
          b.dataset.view
        );
      }
    );
  }
);


/* =========================================================
   ACTIVITY
   ========================================================= */

function pushActivity(text){

  const feed=
    $("#activityFeed");

  if(!feed)return;

  if(feed.querySelector(".empty")){
    feed.innerHTML="";
  }

  const row=
    document.createElement("div");

  row.className="feed-item";

  row.innerHTML=
    "<b>"+
    nowStr()+
    "</b> — "+
    escapeHtml(text);

  feed.prepend(row);

  while(feed.children.length>8){

    feed.removeChild(
      feed.lastChild
    );
  }
}


/* =========================================================
   NOTES
   ========================================================= */

function renderNotes(filter){

  const list=
    $("#notesList");

  if(!list)return;

  list.innerHTML="";

  const f=
    (filter||"").toLowerCase();

  const items=
    state.notes
      .filter(
        n=>
          !f||
          String(n.text||"")
            .toLowerCase()
            .includes(f)
      )
      .sort(
        (a,b)=>b.ts-a.ts
      );

  if(!items.length){

    list.innerHTML=
      '<div class="empty">No notes yet.</div>';

    return;
  }

  items.forEach(n=>{

    const card=
      document.createElement("div");

    card.className=
      "item-card";

    card.innerHTML=
      '<div class="body">'+
      '<p contenteditable="true" class="editable">'+
      escapeHtml(n.text)+
      '</p>'+
      '<div class="meta">'+
      new Date(n.ts).toLocaleString(
        "de-DE",
        {
          month:"short",
          day:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        }
      )+
      '</div>'+
      '</div>'+
      '<div class="actions">'+
      '<button class="icon-btn" data-act="del" title="Delete">×</button>'+
      '</div>';

    card
      .querySelector(".editable")
      .addEventListener(
        "blur",
        e=>{

          n.text=
            e.target.textContent.trim();

          queueSave();
        }
      );

    card
      .querySelector(
        "[data-act=del]"
      )
      .addEventListener(
        "click",
        ()=>{

          state.notes=
            state.notes.filter(
              x=>x.id!==n.id
            );

          renderNotes(
            $("#noteSearch")?.value
          );

          updateStats();
          queueSave();
        }
      );

    list.appendChild(card);
  });
}

function addNote(text){

  text=
    String(text||"").trim();

  if(!text)return null;

  const n={
    id:uid(),
    text,
    ts:Date.now()
  };

  state.notes.push(n);

  renderNotes();
  updateStats();
  queueSave();

  pushActivity(
    'Note saved: "'+
    truncate(text,40)+
    '"'
  );

  return n;
}

if($("#addNoteBtn")){

  $("#addNoteBtn").addEventListener(
    "click",
    ()=>{
      addNote(
        $("#noteInput").value
      );

      $("#noteInput").value="";
    }
  );
}

if($("#noteInput")){

  $("#noteInput").addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        addNote(e.target.value);

        e.target.value="";
      }
    }
  );
}

if($("#noteSearch")){

  $("#noteSearch").addEventListener(
    "input",
    e=>{
      renderNotes(
        e.target.value
      );
    }
  );
}


/* =========================================================
   TASKS
   ========================================================= */

function renderTasks(){

  const list=
    $("#tasksList");

  if(!list)return;

  list.innerHTML="";

  const order={
    high:0,
    med:1,
    low:2
  };

  const items=
    [...state.tasks].sort(
      (a,b)=>
        (a.done-b.done)||
        (order[a.priority]-
         order[b.priority])||
        (b.ts-a.ts)
    );

  if(!items.length){

    list.innerHTML=
      '<div class="empty">No tasks yet.</div>';

    return;
  }

  items.forEach(t=>{

    const card=
      document.createElement("div");

    card.className=
      "item-card";

    const priLabel={
      high:"HIGH",
      med:"MED",
      low:"LOW"
    }[t.priority]||"MED";

    card.innerHTML=
      '<div class="body">'+
      '<p class="'+
      (t.done?"done":"")+
      '">'+
      '<span class="pri '+
      t.priority+
      '">'+
      priLabel+
      "</span>"+
      escapeHtml(t.text)+
      '</p>'+
      '<div class="meta">'+
      new Date(t.ts).toLocaleString(
        "de-DE",
        {
          month:"short",
          day:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        }
      )+
      '</div>'+
      '</div>'+
      '<div class="actions">'+
      '<button class="icon-btn" data-act="done">✓</button>'+
      '<button class="icon-btn" data-act="del">×</button>'+
      '</div>';

    card
      .querySelector(
        "[data-act=done]"
      )
      .addEventListener(
        "click",
        ()=>{

          t.done=!t.done;

          renderTasks();
          updateStats();
          queueSave();

          pushActivity(
            (
              t.done
              ?'Task completed: "'
              :'Task reopened: "'
            )+
            truncate(t.text,40)+
            '"'
          );
        }
      );

    card
      .querySelector(
        "[data-act=del]"
      )
      .addEventListener(
        "click",
        ()=>{

          state.tasks=
            state.tasks.filter(
              x=>x.id!==t.id
            );

          renderTasks();
          updateStats();
          queueSave();
        }
      );

    list.appendChild(card);
  });
}

function addTask(text,priority){

  text=
    String(text||"").trim();

  if(!text)return null;

  const t={
    id:uid(),
    text,
    priority:priority||"med",
    done:false,
    ts:Date.now()
  };

  state.tasks.push(t);

  renderTasks();
  updateStats();
  queueSave();

  pushActivity(
    'Task added: "'+
    truncate(text,40)+
    '"'
  );

  return t;
}

if($("#addTaskBtn")){

  $("#addTaskBtn").addEventListener(
    "click",
    ()=>{
      addTask(
        $("#taskInput").value,
        $("#taskPriority").value
      );

      $("#taskInput").value="";
    }
  );
}

if($("#taskInput")){

  $("#taskInput").addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter"){

        addTask(
          e.target.value,
          $("#taskPriority").value
        );

        e.target.value="";
      }
    }
  );
}

function updateStats(){

  if($("#statNotes"))
    $("#statNotes").textContent=
      state.notes.length;

  if($("#statTasksOpen"))
    $("#statTasksOpen").textContent=
      state.tasks.filter(
        t=>!t.done
      ).length;

  if($("#statTasksDone"))
    $("#statTasksDone").textContent=
      state.tasks.filter(
        t=>t.done
      ).length;
}


/* =========================================================
   SPEECH OUTPUT
   ========================================================= */

let jarvisSpeaking=false;
let speechVoices=[];
let muted=false;

function refreshSpeechVoices(){

  if(!("speechSynthesis" in window)){
    speechVoices=[];
    return;
  }

  try{

    const voices=
      window.speechSynthesis.getVoices();

    if(voices&&voices.length){
      speechVoices=voices;
    }

  }catch(e){}
}

function unlockSpeech(){

  if(!("speechSynthesis" in window))
    return;

  try{
    window.speechSynthesis.resume();
  }catch(e){}
}

if("speechSynthesis" in window){

  refreshSpeechVoices();

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    refreshSpeechVoices
  );
}

function getBestGermanVoice(){

  refreshSpeechVoices();

  const voices=
    speechVoices||[];

  const german=
    voices.filter(
      v=>
        /^de(-|$)/i.test(
          v.lang||""
        )
    );

  return (
    german.find(
      v=>
        /male|männ|mann|deep|david|markus|hans/i
          .test(v.name||"")
    )||
    german.find(
      v=>
        /^de-DE/i.test(v.lang||"")
    )||
    german[0]||
    voices.find(
      v=>
        /male|männ|mann|deep|david|markus|hans/i
          .test(v.name||"")
    )||
    voices[0]||
    null
  );
}

function speak(text){

  text=
    String(text||"").trim();

  if(!text)return;

  logVoice(
    "jarvis",
    text
  );

  jarvisSpeaking=true;

  if($("#transcript")){

    $("#transcript").textContent=
      text;
  }

  setOrb(false);

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}
  }

  if(
    state.settings.speak===false||
    muted||
    !("speechSynthesis" in window)
  ){

    jarvisSpeaking=false;

    if(
      continuousMode&&
      !voiceProcessing
    ){

      setTimeout(
        startListening,
        300
      );
    }

    return;
  }

  const synth=
    window.speechSynthesis;

  try{
    synth.cancel();
    synth.resume();
  }catch(e){}

  let finished=false;

  const finish=()=>{

    if(finished)return;

    finished=true;
    jarvisSpeaking=false;

    if(
      continuousMode&&
      !voiceProcessing
    ){

      setTimeout(
        startListening,
        350
      );
    }
  };

  const doSpeak=()=>{

    try{

      refreshSpeechVoices();

      const preferred=
        getBestGermanVoice();

      const utterance=
        new SpeechSynthesisUtterance(
          text
        );

      if(preferred){
        utterance.voice=
          preferred;
      }

      utterance.lang=
        preferred?.lang||
        "de-DE";

      utterance.rate=.94;
      utterance.pitch=.68;
      utterance.volume=1;

      utterance.onstart=()=>{

        jarvisSpeaking=true;

        if($("#transcript")){

          $("#transcript").textContent=
            text;
        }
      };

      utterance.onend=finish;

      utterance.onerror=e=>{

        console.error(
          "JARVIS speech error:",
          e
        );

        finish();
      };

      unlockSpeech();

      synth.speak(
        utterance
      );

      setTimeout(
        ()=>{
          if(
            jarvisSpeaking&&
            synth.speaking
          ){
            try{
              synth.resume();
            }catch(e){}
          }
        },
        150
      );

    }catch(e){

      console.error(
        "Speech output error:",
        e
      );

      finish();
    }
  };

  if(
    !speechVoices||
    !speechVoices.length
  ){

    let called=false;

    const once=()=>{

      if(called)return;

      called=true;

      synth.removeEventListener(
        "voiceschanged",
        once
      );

      doSpeak();
    };

    synth.addEventListener(
      "voiceschanged",
      once
    );

    setTimeout(
      ()=>{
        if(!called){
          called=true;

          synth.removeEventListener(
            "voiceschanged",
            once
          );

          doSpeak();
        }
      },
      500
    );

  }else{

    doSpeak();
  }
}


/* =========================================================
   VOICE LOG
   ========================================================= */

function logVoice(who,text){

  const log=
    $("#voiceLog");

  if(log){

    const row=
      document.createElement("div");

    row.className=
      "log-row"+
      (
        who==="jarvis"
        ?" jarvis"
        :""
      );

    row.innerHTML=
      '<span class="who">'+
      (
        who==="jarvis"
        ?"JARVIS"
        :"YOU"
      )+
      "</span>"+
      escapeHtml(text);

    log.prepend(row);

    while(log.children.length>20){

      log.removeChild(
        log.lastChild
      );
    }
  }

  if(who!=="system"){

    state.conversations.push({
      who,
      text,
      ts:Date.now()
    });

    if(
      state.conversations.length>200
    ){

      state.conversations.shift();
    }

    queueSave();
  }
}


/* =========================================================
   AI CONVERSATION
   ========================================================= */

function conversationForAI(currentMessage){

  let items=
    state.conversations.slice(-20);

  if(items.length){

    const last=
      items[items.length-1];

    if(
      last.who==="you"&&
      String(last.text||"")
        .trim()===
      String(currentMessage||"")
        .trim()
    ){

      items=
        items.slice(0,-1);
    }
  }

  return items.map(
    x=>({

      role:
        x.who==="jarvis"
        ?"assistant"
        :"user",

      content:
        String(x.text||"")
    })
  );
}

async function askAI(message){

  const backend=
    String(
      state.settings.aiBackend||""
    ).trim();

  if(!backend){

    speak(
      "Mein KI-Backend ist noch nicht eingerichtet. Öffne die Einstellungen und trage dort deine Backend-URL ein."
    );

    switchView("settings");

    return;
  }

  try{

    if($("#transcript")){

      $("#transcript").textContent=
        "JARVIS verarbeitet deine Anfrage…";
    }

    const endpoint=
      backend.replace(/\/$/,"")+
      "/api/chat";

    const res=
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message,

            conversation:
              conversationForAI(
                message
              )
          })
        }
      );

    if(!res.ok){

      let errorText=
        "HTTP "+res.status;

      try{

        const err=
          await res.json();

        if(err?.error){
          errorText=
            String(err.error);
        }

      }catch(e){}

      throw new Error(
        errorText
      );
    }

    const data=
      await res.json();

    const answer=
      String(
        data?.reply||
        "Ich konnte gerade keine Antwort erzeugen."
      ).trim();

    if(!answer){

      throw new Error(
        "Empty AI response"
      );
    }

    speak(answer);

    renderChat();

  }catch(e){

    console.error(
      "AI request error:",
      e
    );

    speak(
      "Ich konnte den KI-Dienst gerade nicht erreichen. Prüfe bitte deine Backend-URL und ob dein Vercel-Backend online ist."
    );
  }
}


/* =========================================================
   VOICE TEXT CLEANUP
   ========================================================= */

function cleanVoiceText(text){

  let s=
    String(text||"")
      .replace(/\s+/g," ")
      .trim();

  if(!s)return "";

  const words=
    s.split(" ");

  const out=[];

  for(const word of words){

    if(
      out.length&&
      out[out.length-1]
        .toLowerCase()===
      word.toLowerCase()
    ){
      continue;
    }

    out.push(word);
  }

  s=
    out.join(" ");

  const w=
    s.split(" ");

  if(
    w.length>=4&&
    w.length%2===0
  ){

    const half=
      w.length/2;

    const a=
      w.slice(0,half)
        .join(" ")
        .toLowerCase();

    const b=
      w.slice(half)
        .join(" ")
        .toLowerCase();

    if(a===b){

      s=
        w.slice(0,half)
          .join(" ");
    }
  }

  return s;
}

  /* =========================================================
   APP DETECTION
   ========================================================= */

function detectAppCommand(text){

  const lower=
    String(text||"")
      .toLowerCase();

  const app=
    Object.keys(appTargets)
      .find(
        name=>
          new RegExp(
            "\\b"+
            name+
            "\\b",
            "i"
          ).test(lower)
      );

  if(!app)return null;

  const openIntent=[
    /\b(?:öffne|oeffne|öffnen|oeffnen|open|starte|start|starten|launch)\b/i,

    /\b(?:mach|mache)\b.*\bauf\b/i,

    /\b(?:kannst du|könntest du|koenntest du)\b.*\b(?:öffnen|oeffnen|open|starten|start|starte)\b/i,

    /\b(?:geh|gehe|bring(?:e)? mich)\b.*\b(?:zu|auf)\b/i
  ];

  return openIntent.some(
    r=>r.test(lower)
  )
  ?app
  :null;
}

function isAndroid(){

  return /Android/i.test(
    navigator.userAgent||""
  );
}

function openApp(target){

  if(!target)return;

  pendingAction=null;

  if($("#confirmBox")){

    $("#confirmBox")
      .classList
      .remove("show");
  }

  pushActivity(
    "Opening app: "+
    target.label
  );

  if(
    isAndroid()&&
    target.androidIntent
  ){

    let fallbackTimer=null;
    let appOpened=false;

    const onVisibility=()=>{

      if(document.hidden){

        appOpened=true;

        if(fallbackTimer){
          clearTimeout(
            fallbackTimer
          );
        }

        document.removeEventListener(
          "visibilitychange",
          onVisibility
        );
      }
    };

    document.addEventListener(
      "visibilitychange",
      onVisibility
    );

    try{

      window.location.href=
        target.androidIntent;

    }catch(e){

      console.error(
        "Android intent error:",
        e
      );
    }

    fallbackTimer=
      setTimeout(
        ()=>{

          document.removeEventListener(
            "visibilitychange",
            onVisibility
          );

          if(!appOpened){

            try{

              window.location.href=
                target.webUrl;

            }catch(e){

              window.open(
                target.webUrl,
                "_blank"
              );
            }
          }

        },
        1500
      );

    return;
  }

  const opened=
    window.open(
      target.webUrl,
      "_blank",
      "noopener,noreferrer"
    );

  if(!opened){

    window.location.href=
      target.webUrl;
  }
}

/* =========================================================
   COMMAND HANDLER
   ========================================================= */

async function handleCommand(raw){

  const cmd=
    cleanVoiceText(raw);

  if(!cmd)return;

  if($("#transcript")){

    $("#transcript").textContent=
      cmd;
  }

  logVoice(
    "you",
    cmd
  );

  const lower=
    cmd.toLowerCase();

  let m;

  m=
    lower.match(
      /^(?:jarvis[, ]*)?(?:save |add |take )?note[:\s]+(.+)/
    );

  if(m){

    const originalStart=
      cmd.toLowerCase()
        .indexOf(
          String(m[1]).toLowerCase()
        );

    const noteText=
      originalStart>=0
      ?cmd.slice(originalStart)
      :m[1];

    addNote(noteText);

    switchView("memory");

    speak(
      "Ich habe die Notiz gespeichert."
    );

    return;
  }

  if(
    /^(?:jarvis[, ]*)?show(?: my)? notes?$/
      .test(lower)
  ){

    switchView("memory");

    speak(
      "Hier sind deine Notizen. Insgesamt "+
      state.notes.length+"."
    );

    return;
  }

  m=
    lower.match(
      /^(?:jarvis[, ]*)?(?:add |create )?task[:\s]+(.+)/
    );

  if(m){

    let text=m[1];
    let priority="med";

    const pm=
      text.match(
        /\b(high|medium|med|low)\s*priority\b/i
      );

    if(pm){

      priority=
        pm[1].toLowerCase()
          .startsWith("h")
        ?"high"
        :pm[1].toLowerCase()
          .startsWith("l")
        ?"low"
        :"med";

      text=
        text.replace(
          pm[0],
          ""
        ).trim();
    }

    addTask(
      text,
      priority
    );

    switchView("tasks");

    speak(
      "Aufgabe hinzugefügt."
    );

    return;
  }

  if(
    /^(?:jarvis[, ]*)?show(?: my)? tasks?$/
      .test(lower)
  ){

    switchView("tasks");

    speak(
      "Du hast "+
      state.tasks.filter(
        t=>!t.done
      ).length+
      " offene Aufgaben."
    );

    return;
  }

  m=
    lower.match(
      /^(?:jarvis[, ]*)?(?:go to |open )?(home|memory|tasks|voice|settings|chat)$/
    );

  if(m){

    switchView(m[1]);

    speak(
      "Öffne "+m[1]+"."
    );

    return;
  }

  const appCommand=
    detectAppCommand(cmd);

  if(appCommand){

    requestAppAction(
      appCommand
    );

    return;
  }

  await askAI(cmd);
}

/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRec=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

let recognition=null;
let listening=false;
let continuousMode=false;
let pttHeld=false;

let voiceBuffer="";
let voiceSilenceTimer=null;
let voiceProcessing=false;
let lastFinalText="";

const VOICE_END_DELAY=1200;


/* =========================================================
   VOICE BUFFER
   ========================================================= */

function scheduleVoiceSend(){

  clearTimeout(
    voiceSilenceTimer
  );

  if(
    !voiceBuffer.trim()||
    voiceProcessing||
    jarvisSpeaking
  ){

    return;
  }

  voiceSilenceTimer=
    setTimeout(
      async()=>{

        if(
          jarvisSpeaking||
          voiceProcessing
        ){

          return;
        }

        const message=
          cleanVoiceText(
            voiceBuffer
          );

        voiceBuffer="";

        if(!message){
          return;
        }

        voiceProcessing=true;

        try{

          await handleCommand(
            message
          );

        }finally{

          voiceProcessing=false;

          lastFinalText="";

          if(
            continuousMode&&
            !jarvisSpeaking
          ){

            setTimeout(
              startListening,
              300
            );
          }
        }

      },
      VOICE_END_DELAY
    );
}


/* =========================================================
   RECOGNITION
   ========================================================= */

function setupRecognition(){

  if(!SpeechRec){

    if($("#transcript")){

      $("#transcript").textContent=
        "Spracherkennung wird in diesem Browser nicht unterstützt.";
    }

    return;
  }

  recognition=
    new SpeechRec();

  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.lang="de-DE";
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{

    listening=true;

    setOrb(true);
  };

  recognition.onresult=e=>{

    let interim="";

    for(
      let i=e.resultIndex;
      i<e.results.length;
      i++
    ){

      const result=
        e.results[i];

      const transcript=
        String(
          result[0]?.transcript||""
        ).trim();

      if(!transcript)
        continue;

      if(result.isFinal){

        const lower=
          transcript.toLowerCase();

        const accepted=
          pttHeld||
          continuousMode||
          lower.includes("jarvis");

        if(!accepted)
          continue;

        let stripped=
          transcript
            .replace(
              /^\s*(hey\s+)?jarvis[,]?\s*/i,
              ""
            )
            .trim();

        if(!stripped){

          if($("#transcript")){

            $("#transcript").textContent=
              "Ich höre zu…";
          }

          continue;
        }

        if(jarvisSpeaking)
          continue;

        const cleaned=
          cleanVoiceText(
            stripped
          );

        if(!cleaned)
          continue;

        if(
          cleaned.toLowerCase()===
          lastFinalText.toLowerCase()
        ){

          continue;
        }

        lastFinalText=
          cleaned;

        const current=
          cleanVoiceText(
            voiceBuffer
          );

        if(
          !current||
          !current
            .toLowerCase()
            .endsWith(
              cleaned.toLowerCase()
            )
        ){

          voiceBuffer+=
            (
              voiceBuffer
              ?" "
              :""
            )+
            cleaned;
        }

        voiceBuffer=
          cleanVoiceText(
            voiceBuffer
          );

        if($("#transcript")){

          $("#transcript").textContent=
            voiceBuffer;
        }

        scheduleVoiceSend();

      }else{

        interim+=
          (
            interim
            ?" "
            :""
          )+
          transcript;
      }
    }

    if(interim){

      const preview=
        (
          voiceBuffer
          ?voiceBuffer+" "
          :""
        )+
        interim.trim();

      if($("#transcript")){

        $("#transcript").textContent=
          preview;
      }

      clearTimeout(
        voiceSilenceTimer
      );
    }
  };

  recognition.onerror=e=>{

    console.warn(
      "Speech recognition:",
      e?.error
    );

    setOrb(false);

    listening=false;

    if(
      e?.error==="not-allowed"||
      e?.error==="service-not-allowed"
    ){

      if($("#transcript")){

        $("#transcript").textContent=
          "Mikrofonzugriff wurde blockiert.";
      }

      continuousMode=false;

      if($("#continuousToggle")){

        $("#continuousToggle")
          .classList
          .remove("active");
      }

      return;
    }

    if(
      e?.error==="aborted"
    ){

      return;
    }

    if(
      continuousMode&&
      !jarvisSpeaking&&
      !voiceProcessing
    ){

      setTimeout(
        startListening,
        500
      );
    }
  };

  recognition.onend=()=>{

    listening=false;

    setOrb(false);

    if(
      voiceBuffer.trim()&&
      !voiceProcessing&&
      !jarvisSpeaking
    ){

      scheduleVoiceSend();
    }

    if(
      continuousMode&&
      !jarvisSpeaking&&
      !voiceProcessing
    ){

      setTimeout(
        startListening,
        400
      );
    }
  };
}

function setOrb(on){

  listening=!!on;

  if($("#orb")){

    $("#orb")
      .classList
      .toggle(
        "listening",
        !!on
      );
  }
}

function startListening(){

  if(
    jarvisSpeaking||
    voiceProcessing
  ){

    return;
  }

  if(!recognition){

    setupRecognition();
  }

  if(!recognition)
    return;

  try{

    recognition.start();

  }catch(e){}
}

function stopListening(){

  clearTimeout(
    voiceSilenceTimer
  );

  if(recognition){

    try{
      recognition.stop();
    }catch(e){}
  }

  listening=false;

  setOrb(false);
}


/* =========================================================
   PUSH TO TALK
   ========================================================= */

function beginPTT(e){

  if(e)
    e.preventDefault();

  unlockSpeech();

  pttHeld=true;

  voiceBuffer="";
  lastFinalText="";

  clearTimeout(
    voiceSilenceTimer
  );

  startListening();
}

function endPTT(e){

  if(e)
    e.preventDefault();

  if(!pttHeld)
    return;

  pttHeld=false;

  if(!continuousMode){

    stopListening();
  }

  if(voiceBuffer.trim()){

    scheduleVoiceSend();
  }
}

    endPTT
  );

  $("#ptt").addEventListener(
    "pointerleave",
    e=>{
      if(pttHeld)

  );
}

    !!state.settings.continuous;

  if($("#continuousToggle")){

    $("#continuousToggle")
      .classList
      .toggle(
        "active",
        continuousMode
      );
  }

  if($("#muteBtn")){

    $("#muteBtn")
      .classList
      .toggle(
        "active",
        muted
      );
  }

  if($("#aiBackendInput")){

    $("#aiBackendInput").value=
      state.settings.aiBackend||"";
  }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderAll(){

  renderNotes();
  renderTasks();
  updateStats();
}


/* =========================================================
   STARTUP
   ========================================================= */

localLoad();

applySettingsToUI();

renderAll();

renderChat();

setupRecognition();

if("speechSynthesis" in window){

  refreshSpeechVoices();

  setTimeout(
    refreshSpeechVoices,
    300
  );

  setTimeout(
    refreshSpeechVoices,
    1000
  );

  setTimeout(
    refreshSpeechVoices,
    2000
  );
}

document.addEventListener(
  "pointerdown",
  ()=>{
    unlockSpeech();
  },
  {
    passive:true
  }
);


/* =========================================================
   BOOT
   ========================================================= */

setTimeout(()=>{

  const boot=
    document.getElementById("boot");

  if(boot){

    boot.style.opacity="0";

    setTimeout(
      ()=>{
        boot.remove();
      },
      650
    );
  }

  if(
    continuousMode&&
    !jarvisSpeaking
  ){

    setTimeout(
      startListening,
      500
    );
  }

},900);

})();
</script>
